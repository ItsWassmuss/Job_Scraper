name: LinkedIn Watcher

on:
  # LinkedIn is dispatched explicitly by Indeed Watcher after every Indeed run.
  # workflow_dispatch also preserves manual/backfill operation.
  workflow_dispatch:
    inputs:
      backfill:
        description: "One-time backfill: fetch last 30 days instead of last 6 hours (run once when setting up)"
        required: false
        type: boolean
        default: false

concurrency:
  group: job-scraper-commit-push
  cancel-in-progress: false

jobs:
  scrape:
    name: LinkedIn scrape
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Scrape LinkedIn (last 6h, or 30-day backfill)
        run: |
          if [ "${{ github.event.inputs.backfill }}" = "true" ]; then
            python scrape_jobs.py --linkedin-backfill
          else
            python scrape_jobs.py --linkedin-only
          fi
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          NOTIFY_MIN_FIT: ${{ vars.NOTIFY_MIN_FIT }}

      - name: Refresh Validator inputs
        if: github.event.inputs.backfill != 'true' && vars.ENABLE_DATA_COMMITS == 'true'
        run: |
          git fetch origin main
          git restore --source=FETCH_HEAD --worktree -- validator/state.json
          rm -rf -- validator/batches/
          if git cat-file -e FETCH_HEAD:validator/batches 2>/dev/null; then
            git restore --source=FETCH_HEAD --worktree -- validator/batches/
          fi

      - name: Prepare Validator batches
        if: github.event.inputs.backfill != 'true' && vars.ENABLE_DATA_COMMITS == 'true'
        run: python validator/prepare.py

      - name: Record workflow run
        run: |
          python - <<'EOF'
          import json
          import os
          from datetime import datetime, timezone

          with open("output/linkedin_jobs.json", encoding="utf-8") as f:
              data = json.load(f)

          entry = {
              "workflow": "linkedin",
              "timestamp": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "job_count": int(data.get("total", 0)),
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT", ""),
          }

          with open("output/workflow_runs.jsonl", "a", encoding="utf-8") as f:
              f.write(json.dumps(entry, sort_keys=True) + "\n")
          EOF

      - name: Commit results to repo
        if: vars.ENABLE_DATA_COMMITS == 'true'
        run: |
          git config user.name  "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add -f output/linkedin_jobs.json output/linkedin_jobs.md output/linkedin_jobs.html output/workflow_runs.jsonl output/all_jobs.json output/notified.json
          if [ "${{ github.event.inputs.backfill }}" != "true" ]; then
            new_batches="$RUNNER_TEMP/validator-new-batches.txt"
            : > "$new_batches"
            if [ -d validator/batches ]; then
              while IFS= read -r -d '' batch; do
                if ! git cat-file -e "FETCH_HEAD:$batch" 2>/dev/null; then
                  printf '%s\n' "$batch" >> "$new_batches"
                  git add -- "$batch"
                fi
              done < <(find validator/batches -type f -name '[0-9][0-9][0-9].json' -print0)
            fi

            git restore --source=HEAD --worktree -- validator/state.json
            rm -rf -- validator/batches/
            if git cat-file -e HEAD:validator/batches 2>/dev/null; then
              git restore --source=HEAD --worktree -- validator/batches/
            fi
            while IFS= read -r batch; do
              mkdir -p -- "$(dirname "$batch")"
              git restore --worktree -- "$batch"
            done < "$new_batches"
          fi
          git diff --cached --quiet || git commit -m "chore: update linkedin listings [$(date -u '+%Y-%m-%d %H:%MZ')]"
          git pull --rebase -X ours origin main
          git push
