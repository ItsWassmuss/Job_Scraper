name: Validator Finalizer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "validator/batches/**/*.json"

permissions:
  contents: write

concurrency:
  group: validator-state-writer
  cancel-in-progress: false

jobs:
  finalize:
    name: Finalize Validator batches
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Validator finalizer
        run: python validator/finalize.py

      - name: Validate and commit finalization data
        run: |
          set -euo pipefail

          tracked_changes="$RUNNER_TEMP/validator-tracked-changes"
          untracked_paths="$RUNNER_TEMP/validator-untracked-paths"
          allowed_paths_file="$RUNNER_TEMP/validator-allowed-paths"
          staged_changes="$RUNNER_TEMP/validator-staged-changes"

          git diff --raw --no-renames -z HEAD -- > "$tracked_changes"
          git ls-files --others --exclude-standard -z -- > "$untracked_paths"
          : > "$allowed_paths_file"

          is_mutable_data_path() {
            local path="$1"
            [[ "$path" == "validator/state.json" || "$path" =~ ^validator/batches/[0-9]{8}/[0-9]{3}\.json$ ]]
          }

          is_open_marker_path() {
            local path="$1"
            [[ "$path" =~ ^validator/open_batches/[0-9]{8}-[0-9]{3}\.open$ \
              || "$path" =~ ^validator/batches/[0-9]{8}/[0-9]{3}\.open$ ]]
          }

          invalid_changes=0
          while IFS= read -r -d '' metadata && IFS= read -r -d '' path; do
            status="${metadata##* }"
            if [[ "$status" == "M" ]] && is_mutable_data_path "$path"; then
              printf '%s\0' "$path" >> "$allowed_paths_file"
            elif [[ "$status" == "D" ]] && is_open_marker_path "$path"; then
              printf '%s\0' "$path" >> "$allowed_paths_file"
            else
              printf '  %s %q\n' "$status" "$path"
              invalid_changes=1
            fi
          done < "$tracked_changes"

          while IFS= read -r -d '' path; do
            if is_open_marker_path "$path"; then
              printf '%s\0' "$path" >> "$allowed_paths_file"
            else
              printf '  ?? %q\n' "$path"
              invalid_changes=1
            fi
          done < "$untracked_paths"

          if [ "$invalid_changes" -ne 0 ]; then
            echo "Validator finalization produced disallowed mutations."
            exit 1
          fi

          if [ ! -s "$allowed_paths_file" ]; then
            echo "No validator finalization changes."
            exit 0
          fi

          mapfile -d '' allowed_paths < "$allowed_paths_file"
          git add -- "${allowed_paths[@]}"

          git diff --cached --raw --no-renames -z HEAD -- > "$staged_changes"
          staged_invalid=0
          while IFS= read -r -d '' metadata && IFS= read -r -d '' path; do
            status="${metadata##* }"
            if [[ "$status" == "M" ]] && is_mutable_data_path "$path"; then
              :
            elif [[ "$status" == "A" ]] && is_open_marker_path "$path"; then
              :
            elif [[ "$status" == "D" ]] && is_open_marker_path "$path"; then
              :
            else
              printf '  %s %q\n' "$status" "$path"
              staged_invalid=1
            fi
          done < "$staged_changes"

          if [ "$staged_invalid" -ne 0 ]; then
            echo "Validator finalization staged disallowed mutations."
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "No validator finalization changes."
            exit 0
          fi

          git config user.name  "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git commit -m "chore: finalize validator batches"
          git pull --rebase origin main
          git push origin main
