name: History Compaction Guard

on:
  push:
    branches: [main]

jobs:
  hold-scraper-writers:
    runs-on: ubuntu-latest
    concurrency:
      group: job-scraper-commit-push
      cancel-in-progress: true
    steps:
      - run: sleep 600

  hold-validator-state-writers:
    runs-on: ubuntu-latest
    concurrency:
      group: validator-state-writer
      cancel-in-progress: true
    steps:
      - run: sleep 600

  hold-validator-apply:
    runs-on: ubuntu-latest
    concurrency:
      group: validator-apply-patch
      cancel-in-progress: true
    steps:
      - run: sleep 600
