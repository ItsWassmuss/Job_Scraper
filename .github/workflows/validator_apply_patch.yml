name: Validator Apply Patch

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "validator/patches/*.json"
      - "validator/runtime.lock"

permissions:
  contents: write
  actions: write

concurrency:
  group: validator-apply-patch
  cancel-in-progress: false

jobs:
  apply:
    name: Apply Validator patches
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'push' ||
      (
        !startsWith(github.event.head_commit.message, 'chore: acquire validator runtime lock [apply]') &&
        !startsWith(github.event.head_commit.message, 'chore: release validator runtime lock [apply]')
      )

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Determine lock mode and pending patch work
        id: preflight
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f validator/runtime_lock_v1.enabled ]; then
            echo "locking=false" >> "$GITHUB_OUTPUT"
            echo "run_apply=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "locking=true" >> "$GITHUB_OUTPUT"

          shopt -s nullglob
          patches=(validator/patches/*.json)
          if [ "${#patches[@]}" -eq 0 ]; then
            echo "run_apply=false" >> "$GITHUB_OUTPUT"
          else
            echo "run_apply=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Acquire shared Validator lock
        id: lock
        if: steps.preflight.outputs.run_apply == 'true' && steps.preflight.outputs.locking == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          token="apply-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "token=$token" >> "$GITHUB_OUTPUT"

          set +e
          output="$(python validator/repo_lock.py acquire --owner apply --token "$token" 2>&1)"
          rc=$?
          set -e

          printf '%s\n' "$output"

          if [ "$rc" -eq 0 ]; then
            echo "acquired=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$rc" -eq 10 ]; then
            echo "acquired=false" >> "$GITHUB_OUTPUT"
            echo "Shared Validator lock is busy; fail-fast without applying patches."
            exit 0
          fi

          exit "$rc"

      - name: Refresh main after lock acquisition
        if: steps.preflight.outputs.locking == 'true' && steps.lock.outputs.acquired == 'true'
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Apply Validator patches
        if: >-
          steps.preflight.outputs.run_apply == 'true' &&
          (
            steps.preflight.outputs.locking != 'true' ||
            steps.lock.outputs.acquired == 'true'
          )
        run: python validator/apply_patch.py

      - name: Validate, commit, and push patch results
        id: persist
        if: >-
          steps.preflight.outputs.run_apply == 'true' &&
          (
            steps.preflight.outputs.locking != 'true' ||
            steps.lock.outputs.acquired == 'true'
          )
        run: |
          set -euo pipefail

          tracked_changes="$RUNNER_TEMP/validator-patch-tracked-changes"
          untracked_paths="$RUNNER_TEMP/validator-patch-untracked-paths"
          allowed_paths_file="$RUNNER_TEMP/validator-patch-allowed-paths"
          staged_changes="$RUNNER_TEMP/validator-patch-staged-changes"

          git diff --raw --no-renames -z HEAD -- > "$tracked_changes"
          git ls-files --others --exclude-standard -z -- > "$untracked_paths"
          : > "$allowed_paths_file"

          is_batch_path() {
            local path="$1"
            [[ "$path" =~ ^validator/batches/[0-9]{8}/[0-9]{3}\.json$ ]]
          }

          is_patch_path() {
            local path="$1"
            [[ "$path" =~ ^validator/patches/[0-9]{8}-[0-9]{3}-[0-9]{3}\.json$ ]]
          }

          invalid_changes=0

          while IFS= read -r -d '' metadata && IFS= read -r -d '' path; do
            status="${metadata##* }"

            if [[ "$status" == "M" ]] && is_batch_path "$path"; then
              printf '%s\0' "$path" >> "$allowed_paths_file"
            elif [[ "$status" == "D" ]] && is_patch_path "$path"; then
              printf '%s\0' "$path" >> "$allowed_paths_file"
            else
              printf '  %s %q\n' "$status" "$path"
              invalid_changes=1
            fi
          done < "$tracked_changes"

          while IFS= read -r -d '' path; do
            printf '  ?? %q\n' "$path"
            invalid_changes=1
          done < "$untracked_paths"

          if [ "$invalid_changes" -ne 0 ]; then
            echo "Validator patch application produced disallowed mutations."
            exit 1
          fi

          if [ ! -s "$allowed_paths_file" ]; then
            echo "No Validator patch changes."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -d '' allowed_paths < "$allowed_paths_file"
          git add -- "${allowed_paths[@]}"

          git diff --cached --raw --no-renames -z HEAD -- > "$staged_changes"
          staged_invalid=0

          while IFS= read -r -d '' metadata && IFS= read -r -d '' path; do
            status="${metadata##* }"

            if [[ "$status" == "M" ]] && is_batch_path "$path"; then
              :
            elif [[ "$status" == "D" ]] && is_patch_path "$path"; then
              :
            else
              printf '  %s %q\n' "$status" "$path"
              staged_invalid=1
            fi
          done < "$staged_changes"

          if [ "$staged_invalid" -ne 0 ]; then
            echo "Validator patch application staged disallowed mutations."
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "No staged Validator patch changes."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name  "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git commit -m "chore: apply validator patches"

          git pull --rebase origin main
          git push origin main

          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Release shared Validator lock
        id: unlock
        if: always() && steps.preflight.outputs.locking == 'true' && steps.lock.outputs.acquired == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python validator/repo_lock.py release \
            --owner apply \
            --token "${{ steps.lock.outputs.token }}"

      - name: Dispatch Validator Finalizer
        if: >-
          steps.persist.outputs.pushed == 'true' &&
          (
            steps.preflight.outputs.locking != 'true' ||
            steps.unlock.outcome == 'success'
          )
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run validator_finalize.yml --ref main
